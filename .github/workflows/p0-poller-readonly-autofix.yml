name: P0 Poller Readonly Autofix (audit branch only)

on:
  push:
    branches:
      - audit/telegram-history-and-hardening
    paths:
      - 'scripts/fix-p0-poller-readonly.js'
      - '.github/workflows/p0-poller-readonly-autofix.yml'

permissions:
  contents: write

jobs:
  poller-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/telegram-history-and-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply deterministic poller safety patch
        run: node scripts/fix-p0-poller-readonly.js
      - name: Validate syntax before commit
        run: |
          npm ci --ignore-scripts
          npm run validate
      - name: Commit bot.js fix if needed
        run: |
          if git diff --quiet -- bot.js; then
            echo 'No poller P0 change required.'
            exit 0
          fi
          git config user.name 'signatureSB-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bot.js
          git commit -m 'fix: make inbound lead poller read-only by default'
          git push origin HEAD:audit/telegram-history-and-hardening
