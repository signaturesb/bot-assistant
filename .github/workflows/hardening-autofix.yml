name: Hardening Autofix (audit branch only)

on:
  push:
    branches:
      - audit/telegram-history-and-hardening
    paths:
      - 'scripts/fix-memory-defaults.js'
      - '.github/workflows/hardening-autofix.yml'

permissions:
  contents: write

jobs:
  memory-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/telegram-history-and-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply deterministic memory defaults fix
        run: node scripts/fix-memory-defaults.js
      - name: Validate before commit
        run: |
          npm ci --ignore-scripts
          npm run validate
          npm run audit-memory
      - name: Commit fix if needed
        run: |
          if git diff --quiet -- bot.js; then
            echo 'No bot.js change required.'
            exit 0
          fi
          git config user.name 'signatureSB-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bot.js
          git commit -m 'fix: make memory compaction reachable'
          git push origin HEAD:audit/telegram-history-and-hardening
