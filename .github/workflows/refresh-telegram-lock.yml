name: Refresh Telegram lockfile

on:
  push:
    branches:
      - audit/telegram-dependency-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/telegram-dependency-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Regenerate canonical lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Regenerate lockfile for Telegram v1.2"
          git push
