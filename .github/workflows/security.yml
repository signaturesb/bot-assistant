name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - 'BOT_STATUS.md'
      - 'BOT_ACTIVITY.md'
      - 'BOOT_REPORT.md'
      - 'SESSION_LIVE.md'
      - '**/*.md'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Lundi 9h UTC — scan hebdo automatique

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_COMMENTS: true

  validate:
    name: Validate + safety guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Syntax + validations
        run: npm run validate
      - name: Memory + persistence audit
        run: npm run audit-memory
      - name: Dangerous surface audit
        run: npm run audit-dangerous-surfaces
      - name: Email one-shot consent regression tests
        run: npm run test-email-guard
      - name: Pipedrive write guard regression tests
        run: npm run test-pipedrive-guard
      - name: Brevo diagnostics must remain read-only
        run: npm run test-brevo-readonly

  audit:
    name: npm audit — vulnérabilités dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Audit high/critical
        run: npm audit --audit-level=high
        continue-on-error: false
